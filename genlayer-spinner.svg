<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  style="overflow: visible;"
>
  <style>
    .system {
      transform-origin: 32px 32px;
      transform-box: view-box;
      animation: systemSpin 3.5s linear infinite;
    }

    .left-wing {
      transform-origin: 32px 32px;
      transform-box: view-box;
      animation: leftSeparate 3.5s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    .right-wing {
      transform-origin: 32px 32px;
      transform-box: view-box;
      animation: rightSeparate 3.5s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    .core {
      transform-origin: 32px 41px;
      transform-box: view-box;
      animation: coreSpin 3.5s linear infinite;
    }

    @keyframes systemSpin {
      0%, 25% { transform: rotate(0deg); }
      55% { transform: rotate(360deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes leftSeparate {
      0%, 12% { transform: translate(0, 0) rotate(0deg); }
      25%, 55% { transform: translate(-10px, -1px) rotate(-8deg); }
      70%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes rightSeparate {
      0%, 12% { transform: translate(0, 0) rotate(0deg); }
      25%, 55% { transform: translate(10px, -1px) rotate(8deg); }
      70%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes coreSpin {
      0%, 25% { transform: rotate(0deg); }
      55% { transform: rotate(-360deg); }
      100% { transform: rotate(-360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .system, .left-wing, .right-wing, .core {
        animation: none;
      }
    }
  </style>

  <g class="system">
    <g class="left-wing">
      <path d="M32 7 L32 28 L25 41 L9 49 L32 7 Z" fill="currentColor"/>
    </g>
    <g class="right-wing">
      <path d="M32 7 L55 49 L39 41 L32 28 L32 7 Z" fill="currentColor"/>
    </g>
    <g class="core">
      <path d="M32 33 L38 43 L32 48 L26 43 L32 33 Z" fill="currentColor"/>
    </g>
  </g>
</svg>