<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Spinner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
    }

    .demo-grid {
      display: flex;
      gap: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .demo-box p {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .spinner {
      width: 96px;
      height: 96px;
    }

    .spinner svg {
      width: 100%;
      height: 100%;
    }

    /* Dark background */
    .dark {
      background: #0f172a;
      color: #38bdf8;
      padding: 2rem;
      border-radius: 16px;
    }

    /* Light background */
    .light {
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <h1>GenLayer Spinner</h1>

  <div class="demo-grid">
    <!-- Dark -->
    <div class="demo-box">
      <div class="spinner dark">
        <!-- SVG -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
          <style>
            .system{transform-origin:32px 32px;transform-box:view-box;animation:systemSpin 3.5s linear infinite}
            .left-wing{transform-origin:32px 32px;transform-box:view-box;animation:leftSeparate 3.5s cubic-bezier(.4,0,.2,1) infinite}
            .right-wing{transform-origin:32px 32px;transform-box:view-box;animation:rightSeparate 3.5s cubic-bezier(.4,0,.2,1) infinite}
            .core{transform-origin:32px 41px;transform-box:view-box;animation:coreSpin 3.5s linear infinite}
            @keyframes systemSpin{0%,25%{transform:rotate(0deg)}55%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
            @keyframes leftSeparate{0%,12%{transform:translate(0,0) rotate(0deg)}25%,55%{transform:translate(-10px,-1px) rotate(-8deg)}70%,100%{transform:translate(0,0) rotate(0deg)}}
            @keyframes rightSeparate{0%,12%{transform:translate(0,0) rotate(0deg)}25%,55%{transform:translate(10px,-1px) rotate(8deg)}70%,100%{transform:translate(0,0) rotate(0deg)}}
            @keyframes coreSpin{0%,25%{transform:rotate(0deg)}55%{transform:rotate(-360deg)}100%{transform:rotate(-360deg)}}
            @media (prefers-reduced-motion:reduce){.system,.left-wing,.right-wing,.core{animation:none}}
          </style>
          <g class="system">
            <g class="left-wing"><path d="M32 7 L32 28 L25 41 L9 49 L32 7 Z" fill="currentColor"/></g>
            <g class="right-wing"><path d="M32 7 L55 49 L39 41 L32 28 L32 7 Z" fill="currentColor"/></g>
            <g class="core"><path d="M32 33 L38 43 L32 48 L26 43 L32 33 Z" fill="currentColor"/></g>
          </g>
        </svg>
      </div>
      <p>Dark background</p>
    </div>

    <!-- Light -->
    <div class="demo-box">
      <div class="spinner light">
        <!-- SVG -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
          <style>
            .system{transform-origin:32px 32px;transform-box:view-box;animation:systemSpin 3.5s linear infinite}
            .left-wing{transform-origin:32px 32px;transform-box:view-box;animation:leftSeparate 3.5s cubic-bezier(.4,0,.2,1) infinite}
            .right-wing{transform-origin:32px 32px;transform-box:view-box;animation:rightSeparate 3.5s cubic-bezier(.4,0,.2,1) infinite}
            .core{transform-origin:32px 41px;transform-box:view-box;animation:coreSpin 3.5s linear infinite}
            @keyframes systemSpin{0%,25%{transform:rotate(0deg)}55%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
            @keyframes leftSeparate{0%,12%{transform:translate(0,0) rotate(0deg)}25%,55%{transform:translate(-10px,-1px) rotate(-8deg)}70%,100%{transform:translate(0,0) rotate(0deg)}}
            @keyframes rightSeparate{0%,12%{transform:translate(0,0) rotate(0deg)}25%,55%{transform:translate(10px,-1px) rotate(8deg)}70%,100%{transform:translate(0,0) rotate(0deg)}}
            @keyframes coreSpin{0%,25%{transform:rotate(0deg)}55%{transform:rotate(-360deg)}100%{transform:rotate(-360deg)}}
            @media (prefers-reduced-motion:reduce){.system,.left-wing,.right-wing,.core{animation:none}}
          </style>
          <g class="system">
            <g class="left-wing"><path d="M32 7 L32 28 L25 41 L9 49 L32 7 Z" fill="currentColor"/></g>
            <g class="right-wing"><path d="M32 7 L55 49 L39 41 L32 28 L32 7 Z" fill="currentColor"/></g>
            <g class="core"><path d="M32 33 L38 43 L32 48 L26 43 L32 33 Z" fill="currentColor"/></g>
          </g>
        </svg>
      </div>
      <p>Light background</p>
    </div>
  </div>
</body>
</html>
